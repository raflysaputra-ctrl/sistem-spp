<!DOCTYPE html><html lang="id" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>EduPay Admin - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Courier+Prime&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-secondary-fixed": "#0b1c30",
                      "surface-variant": "#e0e3e5",
                      "inverse-on-surface": "#eff1f3",
                      "surface-container": "#eceef0",
                      "error-container": "#ffdad6",
                      "primary-fixed-dim": "#b8c4ff",
                      "secondary-fixed": "#d3e4fe",
                      "on-secondary": "#ffffff",
                      "tertiary-fixed-dim": "#ffb59a",
                      "tertiary-container": "#872d00",
                      "on-primary-fixed-variant": "#173bab",
                      "tertiary": "#611e00",
                      "outline-variant": "#c4c5d5",
                      "on-error": "#ffffff",
                      "on-background": "#191c1e",
                      "surface-container-high": "#e6e8ea",
                      "surface-tint": "#3755c3",
                      "on-secondary-container": "#54647a",
                      "surface-bright": "#f7f9fb",
                      "outline": "#757684",
                      "on-tertiary": "#ffffff",
                      "error": "#ba1a1a",
                      "surface-container-lowest": "#ffffff",
                      "surface-dim": "#d8dadc",
                      "inverse-surface": "#2d3133",
                      "secondary-container": "#d0e1fb",
                      "background": "#f7f9fb",
                      "surface": "#f7f9fb",
                      "on-tertiary-fixed": "#380d00",
                      "surface-container-highest": "#e0e3e5",
                      "primary": "#00288e",
                      "on-tertiary-fixed-variant": "#802a00",
                      "surface-container-low": "#f2f4f6",
                      "on-tertiary-container": "#ffa583",
                      "on-secondary-fixed-variant": "#38485d",
                      "secondary-fixed-dim": "#b7c8e1",
                      "on-primary": "#ffffff",
                      "on-surface-variant": "#444653",
                      "on-error-container": "#93000a",
                      "on-primary-container": "#a8b8ff",
                      "primary-fixed": "#dde1ff",
                      "on-primary-fixed": "#001453",
                      "secondary": "#505f76",
                      "primary-container": "#1e40af",
                      "inverse-primary": "#b8c4ff",
                      "on-surface": "#191c1e",
                      "tertiary-fixed": "#ffdbce"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "container-max": "1440px",
                      "margin-mobile": "16px",
                      "sidebar-width": "260px",
                      "stack-sm": "8px",
                      "stack-lg": "24px",
                      "stack-md": "16px",
                      "gutter": "24px"
              },
              "fontFamily": {
                      "headline-sm": ["Inter"],
                      "display-lg": ["Inter"],
                      "headline-md": ["Inter"],
                      "mono-data": ["Courier Prime"],
                      "label-md": ["Inter"],
                      "body-lg": ["Inter"],
                      "body-sm": ["Inter"],
                      "body-md": ["Inter"]
              },
              "fontSize": {
                      "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "mono-data": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "body-sm": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
              }
            }
          }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden antialiased">
<!-- Decorative background elements to avoid plain look but keep it corporate -->
<div class="absolute inset-0 pointer-events-none opacity-20">
<div class="absolute top-0 left-0 w-96 h-96 bg-primary-fixed-dim rounded-full mix-blend-multiply filter blur-3xl opacity-30 transform -translate-x-1/2 -translate-y-1/2"></div>
<div class="absolute bottom-0 right-0 w-96 h-96 bg-secondary-fixed-dim rounded-full mix-blend-multiply filter blur-3xl opacity-30 transform translate-x-1/3 translate-y-1/3"></div>
</div>
<!-- Login Container -->
<main class="w-full max-w-md p-stack-lg z-10">
<!-- Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-lg shadow-sm w-full flex flex-col gap-stack-lg">
<!-- Header -->
<div class="flex flex-col items-center text-center gap-stack-sm">
<div class="w-16 h-16 bg-primary-container text-on-primary-container rounded-lg flex items-center justify-center mb-2 shadow-sm border border-outline-variant/30">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: &quot;FILL&quot; 1;">account_balance</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary">Pembayaran SPP<br>SMK Informatika CBI</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Silakan masuk untuk mengelola pembayaran SPP</p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Username -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface" for="username">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-outline">person</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="username" name="username" placeholder="Masukkan username" required="" type="text">
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-stack-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Lupa Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-10 py-2 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="password" name="password" placeholder="Masukkan password" required="" type="password">
<button class="absolute right-3 top-1/2 transform -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-2">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/20 bg-surface" id="remember" name="remember" type="checkbox">
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">Ingat saya</label>
</div>
<!-- Submit Button -->
<button class="w-full py-3 bg-primary text-on-primary font-label-md text-label-md rounded-lg shadow-sm hover:bg-primary-container transition-all active:scale-[0.98] mt-2 flex items-center justify-center gap-2" type="submit">
                    Masuk ke Sistem
                    <span class="material-symbols-outlined text-lg">login</span>
</button>
</form>
</div>
</main>
<!-- Footer -->
<footer class="absolute bottom-stack-lg z-10 text-center">

</footer>
<script>
        // Password toggle logic
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        });
    </script>


</body></html>
